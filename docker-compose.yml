services:
  grok2api_go:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: grok2api-go-local:latest
    environment:
      TZ: Asia/Shanghai
      GROK2API_CONFIG_SOURCE: /run/grok2api/config.yaml
    ports:
      - "${GROK2API_PORT:-18002}:8000"
    volumes:
      - type: bind
        source: ./gateway-config/config.yaml
        target: /run/grok2api/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - grok2api_gateway_data:/app/data
    depends_on:
      warp:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  warp:
    image: caomingjun/warp:latest
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
    volumes:
      - warp_state:/var/lib/cloudflare-warp
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["flaresolverr"]
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
    restart: unless-stopped

volumes:
  grok2api_gateway_data:
  warp_state:
